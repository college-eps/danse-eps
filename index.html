<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Danse EPS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  /* Danse EPS : studio de danse lumineux, violet profond + rose, gros boutons pour les doigts des élèves */
  --fond: #F5F3FA;
  --surface: #FFFFFF;
  --encre: #221B36;
  --doux: #6A6383;
  --trait: rgba(106, 99, 131, .35);
  --accent: #7C3AED;
  --accent2: #DB2777;
  --bleu: #2563EB;
  --ok: #16A34A;
  --danger: #DC2626;
  --ombre: 0 1px 2px rgba(34, 27, 54, .06), 0 4px 14px rgba(34, 27, 54, .06);
  --rayon: 18px;
  --police-titre: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --police: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fond: #15111F; --surface: #211B2F; --encre: #F2EEFB; --doux: #A9A1C0; --trait: rgba(169, 161, 192, .35);
    --accent: #A78BFA; --accent2: #F472B6; --bleu: #3B82F6; --ok: #22C55E; --danger: #F87171;
    --ombre: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --fond: #15111F; --surface: #211B2F; --encre: #F2EEFB; --doux: #A9A1C0; --trait: rgba(169, 161, 192, .35);
  --accent: #A78BFA; --accent2: #F472B6; --bleu: #3B82F6; --ok: #22C55E; --danger: #F87171;
  --ombre: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--fond); color: var(--encre); font: 17px/1.5 var(--police); -webkit-tap-highlight-color: transparent; }
h1, h2, h3, h4 { font-family: var(--police-titre); font-weight: 600; line-height: 1.2; margin: 0 0 .4em; text-wrap: balance; }
h1 { font-size: 1.8rem; } h2 { font-size: 1.35rem; } h3 { font-size: 1.12rem; } h4 { font-size: 1rem; margin-top: .8em; }
p { margin: 0 0 .6em; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.cache { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
[hidden] { display: none !important; }

/* Barre du haut */
.barre-haut { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 8px; padding: 10px 16px;
  background: color-mix(in srgb, var(--fond) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--trait); }
.barre-haut h1 { flex: 1; margin: 0; font-size: 1.25rem; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.barre-haut button { border: 0; background: var(--surface); border-radius: 999px; padding: 8px 14px; font-weight: 700; cursor: pointer; box-shadow: var(--ombre); min-width: 44px; }
#retour { color: var(--accent); }
main { max-width: 780px; margin: 0 auto; padding: 16px 16px 60px; display: flex; flex-direction: column; gap: 14px; }

/* Cartes et textes */
.carte { background: var(--surface); border-radius: var(--rayon); padding: 16px; box-shadow: var(--ombre); display: flex; flex-direction: column; gap: 8px; }
.carte.violet { background: color-mix(in srgb, var(--accent) 7%, var(--surface)); }
.titre-carte { display: flex; gap: 8px; align-items: center; margin: 4px 0 2px; }
.discret { color: var(--doux); }
.petit { font-size: .85rem; color: var(--doux); margin: 0; }
.intertitre { color: var(--doux); font-weight: 700; margin: 6px 0 -4px; }
.rubrique { margin: 10px 0 0; font-size: 1.15rem; }
.centre { text-align: center; }
.gros-emoji { font-size: 3rem; line-height: 1; }
.rangee { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.rangee.entre { justify-content: space-between; }
.rangee.fin { justify-content: flex-end; }
.rangee.haut { align-items: flex-start; flex-wrap: nowrap; }
.erreur { color: var(--danger); font-weight: 700; margin: 0; }

label { font-weight: 700; font-size: .95rem; margin-top: 4px; }
input:not([type=checkbox]):not([type=range]):not([type=file]), select, textarea {
  width: 100%; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--trait); background: var(--fond); }
textarea { resize: vertical; }
input[type=range] { width: 100%; accent-color: var(--bleu); }

/* Boutons */
.btn { display: inline-flex; justify-content: center; align-items: center; gap: 6px; padding: 11px 16px; border-radius: 14px;
  border: 1.5px solid var(--trait); background: var(--surface); font-weight: 700; cursor: pointer; text-decoration: none; color: var(--encre); text-align: center; }
.btn:hover { border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-plein { --c: var(--accent); background: var(--c); border-color: var(--c); color: #fff; }
.btn-large { width: 100%; padding: 15px 18px; font-size: 1.05rem; }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.btn.vert-contour { border-color: var(--ok); color: var(--ok); }
.btn-icone { border: 0; background: var(--fond); border-radius: 10px; width: 40px; height: 40px; cursor: pointer; font-size: 1rem; }
.btn-icone.danger { color: var(--danger); }
.btn-icone:disabled { opacity: .3; }
.ajout { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.grille-btn { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }

/* Consigne */
.consigne { --c: var(--bleu); background: var(--c); color: #fff; border-radius: var(--rayon); padding: 16px 18px; }
.consigne-titre { font-family: var(--police-titre); font-size: 1.1rem; font-weight: 600; margin-bottom: 8px; }
.consigne ol { margin: 0; padding: 0; list-style: none; counter-reset: c; display: flex; flex-direction: column; gap: 8px; }
.consigne li { counter-increment: c; display: flex; gap: 10px; align-items: flex-start; }
.consigne li::before { content: counter(c); flex: none; width: 26px; height: 26px; border-radius: 50%; background: #fff; color: var(--c); font-weight: 800; display: grid; place-items: center; font-size: .9rem; }

/* Accueil */
.groupe-haut { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.groupe-haut h2 { margin: 0; }
.barre { height: 10px; border-radius: 999px; background: var(--fond); overflow: hidden; }
.barre span { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .4s; }
.barre.vert span { background: var(--ok); } .barre.jaune span { background: #EAB308; }
.barre.petite { height: 6px; margin-top: 4px; }
.etapes-mini { display: flex; gap: 6px; align-items: center; color: var(--doux); font-weight: 800; }
.etapes-mini .ok { color: var(--ok); }
.etapes-mini small { margin-left: auto; }
.objectif { color: var(--accent); font-weight: 700; margin: 0; }
.carte-parcours { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; align-items: center; padding: 18px; border-radius: 22px; text-decoration: none; color: #fff;
  background: linear-gradient(135deg, #7C3AED, #DB2777); box-shadow: 0 8px 24px rgba(124, 58, 237, .3); }
.cp-emoji { font-size: 2.6rem; grid-row: span 2; }
.cp-texte strong { display: block; font-family: var(--police-titre); font-size: 1.4rem; }
.cp-bouton { grid-column: 2; justify-self: end; background: #fff; color: #7C3AED; padding: 8px 18px; border-radius: 999px; font-weight: 800; }
.lien-guide, .lien { display: flex; gap: 12px; align-items: center; background: var(--surface); border-radius: 16px; padding: 12px 14px; text-decoration: none; color: var(--encre); box-shadow: var(--ombre); }
.lien-guide span:nth-child(2) { flex: 1; } .lien-guide small { display: block; color: var(--doux); }
.lien { --c: var(--accent); background: color-mix(in srgb, var(--c) 12%, var(--surface)); box-shadow: none; padding: 11px 14px; }
.lien span:nth-child(2) { flex: 1; font-weight: 700; }
.liens-grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.fleche { color: var(--doux); font-size: 1.4rem; line-height: 1; }
.grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 12px; }
.tuile { --c: var(--accent); position: relative; display: flex; flex-direction: column; gap: 6px; padding: 14px; min-height: 140px; border-radius: var(--rayon); background: var(--surface); box-shadow: var(--ombre); text-decoration: none; color: var(--encre); border-top: 5px solid var(--c); }
.tuile-icone { width: 48px; height: 48px; display: grid; place-items: center; font-size: 1.6rem; border-radius: 14px; background: color-mix(in srgb, var(--c) 16%, transparent); }
.tuile-ok { position: absolute; top: 12px; right: 12px; }
.tuile small { color: var(--doux); }
.lien-prof { align-self: center; color: var(--doux); font-weight: 700; text-decoration: none; padding: 12px 20px; }

/* Listes */
.liste { display: flex; flex-direction: column; gap: 8px; }
.ligne { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--surface); border-radius: 16px; box-shadow: var(--ombre); text-decoration: none; color: var(--encre); border: 0; text-align: left; cursor: pointer; width: 100%; }
.ligne-texte { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ligne-texte small { color: var(--doux); }
.coche { font-size: 1.2rem; }
.emoji-rond { flex: none; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-size: 1.5rem; background: var(--fond); }
canvas.vignette { flex: none; width: 60px; height: 60px; border-radius: 12px; background: color-mix(in srgb, #F08A24 12%, var(--surface)); }
.etiquette { --c: var(--accent); display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: .8rem; font-weight: 800; color: var(--c); background: color-mix(in srgb, var(--c) 15%, transparent); }

/* Fiches */
.entete { --c: var(--accent); text-align: center; }
.entete-emoji { width: 104px; height: 104px; margin: 0 auto 8px; border-radius: 50%; display: grid; place-items: center; font-size: 3.3rem; background: color-mix(in srgb, var(--c) 20%, var(--surface)); }
.entete p { color: var(--doux); }
.puces { --c: var(--accent); list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.puces li { display: flex; gap: 10px; }
.puces li::before { content: ""; flex: none; width: 8px; height: 8px; margin-top: .55em; border-radius: 50%; background: var(--c); }
.sequence { --c: var(--accent); list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.sequence li { display: flex; gap: 10px; align-items: baseline; }
.sequence span { flex: none; width: 46px; text-align: center; border-radius: 999px; background: var(--c); color: #fff; font-weight: 800; font-size: .8rem; padding: 3px 0; font-variant-numeric: tabular-nums; }
.transfo { display: flex; flex-direction: column; padding: 10px 12px; border-radius: 12px; background: color-mix(in srgb, var(--accent) 9%, var(--surface)); }

/* Lecteur d'animation */
.lecteur { --c: var(--accent); display: flex; flex-direction: column; gap: 10px; }
.scene-anim { position: relative; height: 270px; border-radius: 16px; background: color-mix(in srgb, var(--c) 9%, var(--surface)); }
.scene-anim canvas { width: 100%; height: 100%; display: block; }
.etape-badge { position: absolute; top: 10px; left: 10px; background: var(--c); color: #fff; font-weight: 800; font-size: .8rem; padding: 4px 10px; border-radius: 999px; }
.legende { text-align: center; min-height: 64px; display: flex; flex-direction: column; gap: 2px; justify-content: center; }
.legende-texte { font-family: var(--police-titre); font-size: 1.25rem; font-weight: 600; }
.legende-focus { color: var(--doux); font-size: .9rem; }
.bande { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 8px; }
.bd-case { flex: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px; border-radius: 12px; border: 2.5px solid transparent; background: none; cursor: pointer; }
.bd-case.actif { border-color: var(--c); }
.bd-canvas { width: 70px; height: 70px; }
.bd-num { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: .8rem; background: var(--fond); }
.bd-case.actif .bd-num { background: var(--c); color: #fff; }
.controles { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.controles .btn-plein { --c: inherit; background: var(--c); }

/* Parcours */
.parcours-haut { display: flex; justify-content: space-between; font-weight: 700; color: var(--doux); flex-wrap: wrap; gap: 6px; }
.frise { display: flex; gap: 6px; overflow-x: auto; padding: 6px 2px; }
.frise-pt { flex: none; display: flex; flex-direction: column; align-items: center; gap: 2px; border: 0; background: none; cursor: pointer; }
.frise-pt span { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--doux) 35%, transparent); color: #fff; font-size: 1.1rem; font-weight: 800; }
.frise-pt.ok span { background: var(--ok); }
.frise-pt.courant span { background: var(--accent); outline: 3px solid var(--accent); outline-offset: 3px; }
.frise-pt.ok.courant span { background: var(--ok); }
.frise-pt small { font-weight: 800; color: var(--doux); }
.etape-tete { display: flex; gap: 12px; align-items: center; }
.etape-tete h2 { margin: 0; }
.pourquoi { color: var(--doux); margin: 0; }
.statut { display: flex; gap: 12px; align-items: center; padding: 14px; border-radius: 16px; font-size: 1.05rem; }
.statut span { font-size: 1.6rem; }
.statut small { display: block; }
.statut.ok { background: color-mix(in srgb, var(--ok) 13%, transparent); color: var(--ok); }
.statut.attente { background: color-mix(in srgb, #F59E0B 15%, transparent); color: #B45309; }
.nav-etapes { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; }

/* Défis */
.segments { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); border-radius: 14px; padding: 4px; box-shadow: var(--ombre); }
.segments button { border: 0; background: none; padding: 10px; border-radius: 10px; font-weight: 700; cursor: pointer; }
.segments button.actif { background: var(--accent); color: #fff; }
.tirage { min-height: 220px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 6px; padding: 20px;
  border-radius: 22px; background: color-mix(in srgb, #EF4444 12%, var(--surface)); transition: transform .2s; }
.tirage.roule { transform: scale(.97); }
.defi-texte { font-family: var(--police-titre); font-size: 1.5rem; font-weight: 600; margin: 0; }
.defi-ligne { display: flex; justify-content: space-between; gap: 10px; text-align: left; padding: 10px 12px; border-radius: 12px; border: 0; background: var(--fond); cursor: pointer; }
.defi-ligne.ok { background: color-mix(in srgb, var(--ok) 14%, transparent); }
.defi-mien { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

/* Chorégraphie, carnet */
.bloc { display: flex; gap: 6px; align-items: stretch; background: var(--surface); border-radius: 16px; box-shadow: var(--ombre); padding: 6px; }
.bloc-corps { flex: 1; display: flex; gap: 12px; align-items: flex-start; border: 0; background: none; text-align: left; padding: 8px; cursor: pointer; text-decoration: none; color: var(--encre); min-width: 0; }
.bloc-num { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: #6366F1; color: #fff; font-weight: 800; }
.bloc-actions { display: flex; flex-direction: column; gap: 4px; justify-content: center; }
.humeur { font-size: 2rem; line-height: 1; }
.entree { display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--trait); }
.ligne-fiche { display: flex; gap: 8px; align-items: center; }
.ligne-fiche > :first-child { flex: 1; }

/* Plan de scène */
.phrases { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.phrases button { flex: none; border: 0; padding: 9px 14px; border-radius: 999px; background: var(--surface); font-weight: 800; cursor: pointer; box-shadow: var(--ombre); }
.phrases button.actif { background: #6366F1; color: #fff; }
.plateau { display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 800; color: var(--doux); }
.plateau svg { width: 100%; height: auto; touch-action: none; user-select: none; }
.plancher { fill: color-mix(in srgb, #A16207 18%, var(--surface)); }
.quadrillage { stroke: color-mix(in srgb, #A16207 30%, transparent); stroke-dasharray: 4 4; }
.pion { cursor: grab; transition: transform .6s ease; }
.pion.glisse { cursor: grabbing; transition: none; }
.pion-init { fill: #fff; font: 800 10px var(--police); pointer-events: none; }
.pion-nom { fill: var(--encre); font: 700 8px var(--police); pointer-events: none; }
.legende-danseurs { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .9rem; }
.legende-danseurs i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }

/* Compteur */
.compteur { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 10px 0; }
.anneau { --p: 0; width: 250px; height: 250px; border-radius: 50%; display: grid; place-items: center;
  background: conic-gradient(var(--bleu) calc(var(--p) * 360deg), color-mix(in srgb, var(--bleu) 15%, transparent) 0); }
.anneau > div { width: 210px; height: 210px; border-radius: 50%; background: var(--fond); display: flex; flex-direction: column; align-items: center; justify-content: center; }
#chiffre { font: 700 6.5rem/1 var(--police-titre); font-variant-numeric: tabular-nums; }
#chiffre.un { color: var(--bleu); }
.points { display: flex; gap: 12px; }
.points i { width: 16px; height: 16px; border-radius: 50%; background: color-mix(in srgb, var(--doux) 30%, transparent); transition: transform .1s; }
.points i.on { background: var(--bleu); }
.interrupteur { display: flex; gap: 8px; align-items: center; }

/* Évaluation, spectateur */
.niveaux { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.niveaux button { --c: var(--accent); display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px; border-radius: 12px; border: 2px solid transparent; background: var(--fond); cursor: pointer; }
.niveaux button small { font-size: .72rem; font-weight: 800; }
.niveaux button.choisi { border-color: var(--c); background: color-mix(in srgb, var(--c) 18%, transparent); }
.conseil { color: var(--doux); font-size: .92rem; margin: 0; }
.gros-chiffre { font: 700 2.6rem var(--police-titre); }
.gros-chiffre small { font-size: 1rem; color: var(--doux); }
.avis { border-top: 1px solid var(--trait); padding-top: 8px; display: flex; flex-direction: column; gap: 2px; }
.choix { text-align: left; border: 0; background: none; padding: 8px 0; font-weight: 700; cursor: pointer; }
.choix.choisi { color: var(--accent); }
.puces-grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.puce { --c: var(--accent); border: 2px solid transparent; background: var(--fond); border-radius: 12px; padding: 9px 8px; font-weight: 700; font-size: .9rem; cursor: pointer; }
.puce.choisi { border-color: var(--c); background: color-mix(in srgb, var(--c) 18%, transparent); }
.ressentis { display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: 6px; }
.ressentis button { font-size: 1.8rem; border: 2px solid transparent; background: var(--fond); border-radius: 12px; padding: 4px; cursor: pointer; }
.ressentis button.choisi { border-color: var(--accent2); background: color-mix(in srgb, var(--accent2) 18%, transparent); }
.revelation { font: 600 2rem var(--police-titre); text-align: center; margin: 0; }
.ok-texte { color: var(--ok); font-weight: 800; }
.texte-fiche { white-space: pre-wrap; background: var(--fond); padding: 12px; border-radius: 12px; font-size: .85rem; max-height: 260px; overflow: auto; }

/* Badges */
.badge { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; padding: 14px; border-radius: var(--rayon); background: var(--surface); box-shadow: var(--ombre); }
.badge-emoji { width: 70px; height: 70px; border-radius: 50%; display: grid; place-items: center; font-size: 2.3rem; background: var(--fond); filter: grayscale(1); opacity: .45; }
.badge.ok .badge-emoji { filter: none; opacity: 1; background: rgba(234, 179, 8, .25); }
.badge small { color: var(--doux); }
.badge.ok small { color: var(--ok); font-weight: 800; }
.gros-emoji-ligne { font-size: 1.8rem; margin: 0; }

/* Guide, enseignant */
.num { --c: var(--accent); flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--c); color: #fff; font-weight: 800; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stats .carte { align-items: center; text-align: center; gap: 0; }
.stats strong { font: 700 1.8rem var(--police-titre); color: var(--accent); }
.stats small { color: var(--doux); }
details summary { cursor: pointer; font-weight: 700; }
.vide { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; padding: 40px 10px; }
.vide-emoji { font-size: 3.5rem; }

/* Modale, bienvenue, messages */
.modale { position: fixed; inset: 0; z-index: 50; background: rgba(20, 14, 32, .55); display: grid; place-items: center; padding: 16px; }
.modale-boite { width: min(560px, 100%); max-height: 90vh; overflow: auto; background: var(--surface); border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
.bienvenue { position: fixed; inset: 0; z-index: 60; background: var(--fond); display: grid; place-items: center; padding: 20px; overflow: auto; }
.bienvenue-boite { width: min(560px, 100%); text-align: center; display: flex; flex-direction: column; gap: 12px; }
.bv-emoji { width: 160px; height: 160px; margin: 0 auto; border-radius: 50%; display: grid; place-items: center; font-size: 5rem; background: color-mix(in srgb, var(--accent) 16%, var(--surface)); }
.bienvenue-boite p { font-size: 1.15rem; color: var(--doux); }
.bv-points { display: flex; gap: 8px; justify-content: center; }
.bv-points button { width: 10px; height: 10px; border-radius: 50%; border: 0; background: var(--trait); cursor: pointer; padding: 0; }
.bv-points button.actif { background: var(--accent); width: 26px; border-radius: 999px; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 70; background: var(--encre); color: var(--fond); padding: 12px 18px; border-radius: 14px; font-weight: 700; max-width: calc(100% - 32px); }
.bandeau-badge { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); z-index: 70; display: flex; gap: 12px; align-items: center; padding: 12px 18px; border-radius: 18px; color: #fff;
  background: linear-gradient(90deg, #F59E0B, #EC4899); box-shadow: 0 10px 30px rgba(0, 0, 0, .2); width: min(420px, calc(100% - 32px)); }
.bandeau-badge > span { font-size: 2.2rem; }
.bandeau-badge small { display: block; font-weight: 800; opacity: .9; }
.bandeau-badge.entre { animation: arrive .45s ease-out; }
@keyframes arrive { from { transform: translate(-50%, -30px); opacity: 0; } }

@media (max-width: 420px) {
  body { font-size: 16px; }
  .scene-anim { height: 230px; }
  .anneau { width: 220px; height: 220px; } .anneau > div { width: 184px; height: 184px; }
  .stats strong { font-size: 1.4rem; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

const enDate = s => new Date((Number(s || 0) + REF_SWIFT) * 1000);
const dateCourte = s => enDate(s).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function uid() {
  try { if (crypto.randomUUID) return crypto.randomUUID().toUpperCase(); } catch (e) {}
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 3 | 8)).toString(16).toUpperCase();
  });
}

// ---------- Stockage ----------
const CLE = 'danseEPS.web.v1';
let memoire = null; // si le navigateur refuse le stockage

function etatVide() {
  return { projets: [], actifId: null, code: '', indice: '', bienvenueVue: false };
}

function charger() {
  try {
    const brut = localStorage.getItem(CLE);
    if (brut) {
      const e = Object.assign(etatVide(), JSON.parse(brut));
      e.projets = (e.projets || []).map(normaliser);
      return e;
    }
  } catch (err) {}
  return memoire || etatVide();
}

let S = charger();

function sauver() {
  try { localStorage.setItem(CLE, JSON.stringify(S)); }
  catch (err) { memoire = S; }
}

function normaliser(p) {
  const base = {
    id: uid(), nom: 'Groupe', membres: '', intention: '', themeID: null, musiqueID: null,
    titreMorceau: '', pasIDs: [], procedeIDs: [], defis: [], blocs: [], notes: {},
    commentaire: '', dateCreation: maintenant(), avisSpectateurs: [], journal: [],
    badgesAnnonces: [], etapesValidees: []
  };
  const r = Object.assign(base, p || {});
  r.blocs = (r.blocs || []).map(b => Object.assign({ id: uid(), texte: '', pasID: null, procedeID: null, positions: [] }, b));
  return r;
}

function nouveauProjet(nom, membres) {
  return normaliser({ id: uid(), nom, membres });
}

const actif = () => S.projets.find(p => p.id === S.actifId) || null;
const projetParId = id => S.projets.find(p => p.id === id) || null;

/** Modifie le projet actif (ou un autre), vérifie les badges et enregistre. */
function modifier(fn, projet = actif()) {
  if (!projet) return;
  fn(projet);
  if (projet.id === S.actifId) verifierBadges(projet);
  sauver();
}

function basculer(liste, valeur) {
  const i = liste.indexOf(valeur);
  if (i >= 0) liste.splice(i, 1); else liste.push(valeur);
}

// ---------- Règles du projet ----------
const ETAPES_PROJET = ['theme', 'musique', 'pas', 'procedes', 'choregraphie', 'evaluation'];

function estFaite(p, e) {
  switch (e) {
    case 'theme': return !!p.themeID;
    case 'musique': return !!p.musiqueID;
    case 'pas': return p.pasIDs.length > 0;
    case 'procedes': return p.procedeIDs.length > 0;
    case 'choregraphie': return p.blocs.length > 0;
    case 'evaluation': return D.criteres.every(c => (p.notes[c.id] || 0) > 0);
  }
  return false;
}
const nbEtapesFaites = p => ETAPES_PROJET.filter(e => estFaite(p, e)).length;

function moyenneEval(p) {
  const v = D.criteres.map(c => p.notes[c.id] || 0).filter(x => x > 0);
  return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
}

function danseurs(p) {
  let noms = (p.membres || '').split(/[,;\/\n]| et /).map(s => s.trim()).filter(Boolean);
  if (!noms.length) noms = ['Danseur 1', 'Danseur 2', 'Danseur 3'];
  return noms.slice(0, 12);
}

const themeReconnu = p => p.themeID ? p.avisSpectateurs.filter(a => a.themeDevine === p.themeID).length : 0;

  const nouveaux = badgesObtenus(p).map(b => b.id).filter(id => !p.badgesAnnonces.includes(id));
  if (!nouveaux.length) return;
  p.badgesAnnonces.push(...nouveaux);
  const b = BADGES.find(x => x.id === nouveaux[0]);
  setTimeout(() => annoncerBadge(b), 150);
}

// ---------- Fiche texte (comme l'appli) ----------
function ficheTexte(p) {
  let t = `🩰 PROJET DANSE — ${p.nom}\n`;
  if (p.membres) t += `Danseurs : ${p.membres}\n`;
  const th = theme(p.themeID);
  t += `\n🎭 Thème : ${th ? th.emoji + ' ' + th.nom : 'non choisi'}\n`;
  if (p.intention) t += `Intention : ${p.intention}\n`;
  const mu = musique(p.musiqueID);
  t += `🎶 Musique : ${mu ? mu.emoji + ' ' + mu.nom : 'non choisie'}${p.titreMorceau ? ' — ' + p.titreMorceau : ''}\n`;
  const np = p.pasIDs.map(pasDanse).filter(Boolean).map(x => x.emoji + ' ' + x.nom);
  t += `\n🩰 Pas : ${np.length ? np.join(', ') : 'aucun'}\n`;
  const npr = p.procedeIDs.map(procede).filter(Boolean).map(x => x.emoji + ' ' + x.nom);
  t += `🧩 Procédés : ${npr.length ? npr.join(', ') : 'aucun'}\n`;
  if (p.defis.length) t += '⚡ Défis relevés :\n' + p.defis.map(d => `  • ${d}\n`).join('');
  t += `\n📝 CHORÉGRAPHIE (${p.blocs.length} phrase(s), ${p.blocs.length * 8} temps)\n`;
  p.blocs.forEach((b, i) => {
    t += `Phrase ${i + 1} (temps ${i * 8 + 1} à ${i * 8 + 8}) : ${b.texte || '—'}`;
    const det = [];
    if (pasDanse(b.pasID)) det.push('pas : ' + pasDanse(b.pasID).nom);
    if (procede(b.procedeID)) det.push('procédé : ' + procede(b.procedeID).nom);
    if (det.length) t += ` [${det.join(', ')}]`;
    t += '\n';
  });
  t += '\n⭐ AUTO-ÉVALUATION\n';
  D.criteres.forEach(c => { const n = niveau(p.notes[c.id] || 0); t += `• ${c.nom} : ${n ? n.emoji + ' ' + n.libelle : 'non évalué'}\n`; });
  const m = moyenneEval(p);
  if (m !== null) t += `Moyenne : ${m.toFixed(1)} / 4\n`;
  if (p.commentaire) t += `Commentaire : ${p.commentaire}\n`;
  if (p.avisSpectateurs.length) {
    t += `\n👀 AVIS DES SPECTATEURS (${p.avisSpectateurs.length})\nThème reconnu par ${themeReconnu(p)} groupe(s) sur ${p.avisSpectateurs.length}\n`;
    p.avisSpectateurs.forEach(a => {
      t += `• ${a.observateurs} ${a.ressenti}`;
      if (a.pointFort) t += ` — point fort : ${a.pointFort}`;
      if (a.conseil) t += ` — conseil : ${a.conseil}`;
      t += '\n';
    });
  }
  if (p.journal.length) {
    t += `\n📓 CARNET DE BORD (${p.journal.length} séance(s))\n`;
    [...p.journal].sort((a, b) => a.date - b.date).forEach(e => {
      t += `• ${enDate(e.date).toLocaleDateString('fr-FR')} ${e.humeur} : ${e.fait}`;
      if (e.prochaineEtape) t += ` → prochaine étape : ${e.prochaineEtape}`;
      t += '\n';
    });
  }
  return t;
}

// ---------- Formations du plan de scène ----------
const FORMATIONS = [
  { id: 'ligne', nom: 'Ligne', emoji: '↔️' }, { id: 'colonne', nom: 'Colonne', emoji: '↕️' },
  { id: 'cercle', nom: 'Cercle', emoji: '⭕️' }, { id: 'v', nom: 'En V', emoji: '🔻' },
  { id: 'diagonale', nom: 'Diagonale', emoji: '↘️' }, { id: 'groupes', nom: '2 groupes', emoji: '👥' },
  { id: 'quinconce', nom: 'Quinconce', emoji: '🎲' }
];

function formation(id, n) {
  const rep = (i, tot, a = 0.15, b = 0.85) => tot <= 1 ? (a + b) / 2 : a + (b - a) * i / (tot - 1);
  const R = [...Array(n).keys()];
  switch (id) {
    case 'ligne': return R.map(i => ({ x: rep(i, n), y: 0.55 }));
    case 'colonne': return R.map(i => ({ x: 0.5, y: rep(i, n) }));
    case 'cercle': return n === 1 ? [{ x: .5, y: .5 }] : R.map(i => { const a = 2 * Math.PI * i / n - Math.PI / 2; return { x: .5 + .28 * Math.cos(a), y: .5 + .32 * Math.sin(a) }; });
    case 'v': return R.map(i => { const r = Math.floor((i + 1) / 2), c = i % 2 ? -1 : 1; return { x: Math.min(Math.max(.5 + c * .12 * r, .06), .94), y: Math.max(.82 - .14 * r, .08) }; });
    case 'diagonale': return R.map(i => ({ x: rep(i, n), y: rep(i, n) }));
    case 'groupes': { const m = Math.ceil(n / 2); return R.map(i => { const g = i < m; return { x: g ? .22 : .78, y: rep(g ? i : i - m, g ? m : n - m, .3, .75) }; }); }
    case 'quinconce': { const cols = Math.max(Math.ceil(n / 2), 1); return R.map(i => { const r = i % 2, c = Math.floor(i / 2); return { x: .1 + .8 * ((c + (r ? .75 : .25)) / cols), y: r ? .68 : .4 }; }); }
  }
  return [];
}

function positionsBloc(b, n) {
  const def = formation('ligne', n);
  return [...Array(n).keys()].map(i => { const p = b.positions.find(q => q.danseur === i); return p ? { x: p.x, y: p.y } : def[i]; });
}

// ============================================================
//  Partie 2 : les bonshommes animés (même moteur que l'appli iPad)
// ============================================================

const POSE0 = { tronc: 0, brasG: -15, coudeG: 0, brasD: 15, coudeD: 0, jambeG: -8, genouG: 0, jambeD: 8, genouD: 0, x: 0, saut: 0, tourne: 1 };
const CLES_POSE = Object.keys(POSE0);
const COULEURS_DANSEURS = ['#F08A24', '#8B5CF6', '#14B8A6', '#EC4899'];
const LIBELLE_FOCUS = { genoux: 'les genoux', pieds: 'les pieds', mains: 'les mains', bras: 'les bras', tete: 'la tête et le regard', dos: 'le dos', hanches: 'le bassin' };

function preparerAnimation(a) {
  if (!a || a._pret) return a;
  a.danseurs = a.danseurs.map(d => ({
    poses: d.poses.map(p => Object.assign({}, POSE0, p)),
    x: d.x || 0, decalage: d.decalage || 0, miroir: !!d.miroir
  }));
  a.focus = a.focus || [];
  a.dureePose = a.dureePose || 1;
  a.echelle = a.echelle || 1;
  a.profil = !!a.profil;
  a.vignette = a.vignette || 0;
  a._pret = true;
  return a;
}

function animationDe(cle) {
  const [type, id] = cle.split(':');
  const a = type === 'pas' ? D.animPas[id] : D.animProcedes[id];
  return preparerAnimation(a);
}

const nbPoses = a => a.danseurs[0].poses.length;

function melange(a, b, t) {
  const r = {};
  for (const k of CLES_POSE) r[k] = a[k] + (b[k] - a[k]) * t;
  return r;
}

function poseA(a, d, temps) {
  const n = d.poses.length;
  if (n < 2) return d.poses[0];
  const total = a.dureePose * n;
  let t = (temps - d.decalage * a.dureePose) % total;
  if (t < 0) t += total;
  const i = Math.floor(t / a.dureePose) % n;
  const prec = (i - 1 + n) % n;
  const u = (t - i * a.dureePose) / a.dureePose;
  const av = Math.min(u / 0.55, 1);
  return melange(d.poses[prec], d.poses[i], av * av * (3 - 2 * av));
}

function indexPose(a, temps) {
  const n = nbPoses(a), total = a.dureePose * n;
  let t = temps % total; if (t < 0) t += total;
  return Math.floor(t / a.dureePose) % n;
}
const tempsPose = (a, i) => (i + 0.9) * a.dureePose;

function dir(angle) { const r = angle * Math.PI / 180; return { x: Math.sin(r), y: Math.cos(r) }; }
function plus(p, d, l) { return { x: p.x + d.x * l, y: p.y + d.y * l }; }

function couleurSol() {
  return getComputedStyle(document.documentElement).getPropertyValue('--trait').trim() || 'rgba(120,120,140,.45)';
}

/** Dessine une animation à l'instant `temps` dans un canvas. */
function dessinerAnimation(canvas, a, temps, avecFocus = true) {
  const ratio = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (!w || !h) return;
  if (canvas.width !== Math.round(w * ratio)) { canvas.width = Math.round(w * ratio); canvas.height = Math.round(h * ratio); }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  ctx.clearRect(0, 0, w, h);

  const s = Math.min(w / 240, h / 205);
  const ox = (w - 240 * s) / 2, oy = (h - 205 * s) / 2;
  const ecran = p => ({ x: ox + p.x * s, y: oy + p.y * s });

  // Sol
  ctx.strokeStyle = couleurSol(); ctx.lineWidth = 2.5 * s; ctx.lineCap = 'round';
  ctx.beginPath(); const a1 = ecran({ x: 8, y: 192 }), a2 = ecran({ x: 232, y: 192 });
  ctx.moveTo(a1.x, a1.y); ctx.lineTo(a2.x, a2.y); ctx.stroke();

  const focus = avecFocus ? a.focus[indexPose(a, temps)] : null;
  a.danseurs.forEach((d, n) => {
    const p = poseA(a, d, temps);
    dessinerDanseur(ctx, p, 120 + (d.x + p.x) * 100, a.echelle, a.profil, d.miroir,
      COULEURS_DANSEURS[n % COULEURS_DANSEURS.length], n === 0 ? focus : null, temps, s, ecran);
  });
}

function dessinerDanseur(ctx, pose, baseX, e, profil, miroir, couleur, focus, temps, s, ecran) {
  const O = { x: 0, y: 0 };
  const rt = pose.tronc * Math.PI / 180;
  const dt = { x: Math.sin(rt), y: -Math.cos(rt) };
  const cou = plus(O, dt, 50), milieuDos = plus(O, dt, 25), tete = plus(O, dt, 69), rT = 13;
  const coudeG = plus(cou, dir(pose.brasG), 28), mainG = plus(coudeG, dir(pose.brasG + pose.coudeG), 26);
  const coudeD = plus(cou, dir(pose.brasD), 28), mainD = plus(coudeD, dir(pose.brasD + pose.coudeD), 26);
  const genouG = plus(O, dir(pose.jambeG), 36), piedG = plus(genouG, dir(pose.jambeG + pose.genouG), 36);
  const genouD = plus(O, dir(pose.jambeD), 36), piedD = plus(genouD, dir(pose.jambeD + pose.genouD), 36);

  const pts = [cou, coudeG, mainG, coudeD, mainD, genouG, piedG, genouD, piedD, O];
  const bas = Math.max(Math.max(...pts.map(p => p.y)), tete.y + rT);
  const hy = 192 - (bas + 3 + pose.saut) * e;
  const sens = (miroir ? -1 : 1) * (profil ? 1 : pose.tourne);
  const monde = p => ecran({ x: baseX + p.x * sens * e, y: hy + p.y * e });

  const epM = 9 * e * s, epT = 15 * e * s;
  const membre = (a, b, c, alpha) => {
    ctx.globalAlpha = alpha; ctx.strokeStyle = couleur; ctx.lineWidth = epM; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const A = monde(a), B = monde(b), C = monde(c);
    ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.lineTo(C.x, C.y); ctx.stroke(); ctx.globalAlpha = 1;
  };
  const rond = (p, r, alpha, coul = couleur) => {
    ctx.globalAlpha = alpha; ctx.fillStyle = coul; const c = monde(p);
    ctx.beginPath(); ctx.arc(c.x, c.y, r * e * s, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
  };
  const pied = (ch, alpha) => {
    if (profil) {
      ctx.globalAlpha = alpha; ctx.strokeStyle = couleur; ctx.lineWidth = epM * .85; ctx.lineCap = 'round';
      const A = monde(ch), B = monde({ x: ch.x + 11, y: ch.y + 2 });
      ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.stroke(); ctx.globalAlpha = 1;
    } else rond(ch, 5.5, alpha);
  };

  // Ombre
  const lo = 50 * e * Math.max(.4, 1 - pose.saut / 90);
  const oc = ecran({ x: baseX, y: 192.5 });
  ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.beginPath();
  ctx.ellipse(oc.x, oc.y, lo * s / 2, 3.5 * s, 0, 0, Math.PI * 2); ctx.fill();

  const aG = profil ? .45 : 1;
  membre(O, genouG, piedG, aG); pied(piedG, aG);
  if (profil) { membre(cou, coudeG, mainG, aG); rond(mainG, 5, aG); }
  // tronc
  ctx.strokeStyle = couleur; ctx.lineWidth = epT; ctx.lineCap = 'round';
  const H = monde(O), C = monde(cou);
  ctx.beginPath(); ctx.moveTo(H.x, H.y); ctx.lineTo(C.x, C.y); ctx.stroke();
  membre(O, genouD, piedD, 1); pied(piedD, 1);
  if (!profil) { membre(cou, coudeG, mainG, 1); rond(mainG, 5, 1); }
  membre(cou, coudeD, mainD, 1); rond(mainD, 5, 1);

  // Tête et visage
  rond(tete, rT, 1);
  const c = monde(tete), u = e * s;
  ctx.fillStyle = '#fff';
  if (profil) {
    ctx.beginPath(); ctx.arc(c.x + 5 * sens * u, c.y - 3 * u, 2.2 * u, 0, Math.PI * 2); ctx.fill();
  } else if (pose.tourne > .3) {
    for (const k of [-1, 1]) { ctx.beginPath(); ctx.arc(c.x + k * 4.5 * pose.tourne * u, c.y - 3 * u, 2 * u, 0, Math.PI * 2); ctx.fill(); }
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.6 * u;
    ctx.beginPath(); ctx.arc(c.x, c.y + 1.5 * u, 5 * u * pose.tourne, Math.PI * 0.11, Math.PI * 0.89); ctx.stroke();
  }

  // Zone à regarder
  if (focus) {
    const cibles = { genoux: [genouD], pieds: [piedD], mains: [mainD, mainG], bras: [coudeD, coudeG], tete: [tete], dos: [milieuDos], hanches: [O] }[focus] || [];
    const pul = 1 + .15 * Math.sin(temps * 6);
    ctx.strokeStyle = '#FACC15'; ctx.lineWidth = 3.5 * s;
    for (const ci of cibles) {
      const q = monde(ci); const r = (focus === 'tete' ? 22 : 15) * e * s * pul;
      ctx.beginPath(); ctx.arc(q.x, q.y, r, 0, Math.PI * 2); ctx.stroke();
    }
  }
}

// ---------- Lecteurs sur la page ----------
const lecteurs = new Map();
let boucle = null;
const reduitMouvement = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

function htmlLecteur(cle, couleur) {
  const a = animationDe(cle);
  if (!a) return '';
  const id = 'l' + Math.random().toString(36).slice(2, 8);
  const vignettes = a.danseurs[0].poses.map((_, i) =>
    `<button class="bd-case" data-act="lecteur-aller" data-lecteur="${id}" data-i="${i}" aria-label="Étape ${i + 1}">
       <canvas class="bd-canvas" data-bd="${cle}" data-i="${i}"></canvas><span class="bd-num">${i + 1}</span>
     </button>`).join('');
  return `
  <div class="lecteur" id="${id}" data-cle="${cle}" style="--c:${couleur}">
    <div class="scene-anim"><canvas class="grand"></canvas><span class="etape-badge"></span></div>
    <div class="legende"><strong class="legende-texte"></strong><span class="legende-focus"></span></div>
    <div class="bande">${vignettes}</div>
    <div class="controles">
      <button class="btn" data-act="lecteur-etape" data-lecteur="${id}" data-sens="-1" aria-label="Étape précédente">⏮</button>
      <button class="btn btn-plein lecture" data-act="lecteur-lecture" data-lecteur="${id}">⏸ Pause</button>
      <button class="btn" data-act="lecteur-etape" data-lecteur="${id}" data-sens="1" aria-label="Étape suivante">⏭</button>
      <button class="btn vitesse" data-act="lecteur-vitesse" data-lecteur="${id}">🐇 Normal</button>
    </div>
    <p class="petit">Touche une image de la bande pour voir cette étape. ⏸ puis ⏭ pour avancer étape par étape.</p>
  </div>`;
}

function initialiserLecteurs() {
  document.querySelectorAll('.lecteur').forEach(el => {
    const a = animationDe(el.dataset.cle);
    lecteurs.set(el.id, { el, a, enLecture: !reduitMouvement, debut: performance.now(), fige: 0, lent: false, dernierIndex: -1 });
    if (reduitMouvement) el.querySelector('.lecture').textContent = '▶ Lecture';
  });
  document.querySelectorAll('canvas[data-bd]').forEach(cv => {
    const a = animationDe(cv.dataset.bd);
    dessinerAnimation(cv, a, tempsPose(a, Number(cv.dataset.i)), false);
  });
  document.querySelectorAll('canvas[data-vig]').forEach(cv => {
    const a = animationDe(cv.dataset.vig);
    if (a) dessinerAnimation(cv, a, tempsPose(a, a.vignette), false);
  });
  if (lecteurs.size && !boucle) boucle = requestAnimationFrame(animer);
}

function arreterLecteurs() {
  lecteurs.clear();
  if (boucle) cancelAnimationFrame(boucle);
  boucle = null;
}

const vitesseL = L => L.lent ? 0.4 : 0.8;
const tempsL = L => L.enLecture ? L.fige + (performance.now() - L.debut) / 1000 * vitesseL(L) : L.fige;

function animer() {
  for (const L of lecteurs.values()) {
    const t = tempsL(L);
    dessinerAnimation(L.el.querySelector('canvas.grand'), L.a, t, true);
    const i = indexPose(L.a, t);
    if (i !== L.dernierIndex) {
      L.dernierIndex = i;
      L.el.querySelector('.legende-texte').textContent = L.a.legendes[i] || '';
      const f = L.a.focus[i];
      L.el.querySelector('.legende-focus').textContent = f ? `👁 Regarde bien ${LIBELLE_FOCUS[f]} (cercle jaune)` : '';
      L.el.querySelector('.etape-badge').textContent = `Étape ${i + 1} / ${nbPoses(L.a)}`;
      L.el.querySelectorAll('.bd-case').forEach((b, k) => b.classList.toggle('actif', k === i));
    }
  }
  boucle = lecteurs.size ? requestAnimationFrame(animer) : null;
}

function lecteurAller(id, i) {
  const L = lecteurs.get(id); if (!L) return;
  L.enLecture = false; L.fige = tempsPose(L.a, i);
  L.el.querySelector('.lecture').textContent = '▶ Lecture';
}
function lecteurEtape(id, sens) {
  const L = lecteurs.get(id); if (!L) return;
  const n = nbPoses(L.a);
  lecteurAller(id, (indexPose(L.a, tempsL(L)) + sens + n) % n);
}
function lecteurLecture(id) {
  const L = lecteurs.get(id); if (!L) return;
  if (L.enLecture) { L.fige = tempsL(L); L.enLecture = false; }
  else { L.debut = performance.now(); L.enLecture = true; }
  L.el.querySelector('.lecture').textContent = L.enLecture ? '⏸ Pause' : '▶ Lecture';
}
function lecteurVitesse(id) {
  const L = lecteurs.get(id); if (!L) return;
  L.fige = tempsL(L); L.debut = performance.now(); L.lent = !L.lent;
  L.el.querySelector('.vitesse').textContent = L.lent ? '🐢 Lent' : '🐇 Normal';
}

let indexParcours = null;

function vParcours() {
  const p = actif();
  if (!p) {
    return { titre: 'Mon parcours', html: `
      <div class="centre"><div class="gros-emoji">👥</div><h1>Pour commencer : créez votre groupe</h1></div>
      ${consigne(['Inventez un nom pour votre groupe et écrivez-le dans la première case.', 'Écrivez les prénoms de tous les danseurs, séparés par des virgules.', 'Touchez le bouton vert « Créer notre groupe ».'])}
      ${carte(`<label for="ng-nom">Nom du groupe</label><input id="ng-nom" placeholder="Ex : Les Étoiles" autocomplete="off">
               <label for="ng-membres">Prénoms des danseurs</label><input id="ng-membres" placeholder="Ex : Inès, Tom, Lina" autocomplete="off">`)}
      <button class="btn btn-plein btn-large vert" style="--c:var(--ok)" data-act="creer-groupe-parcours">✅ Créer notre groupe</button>
      ${S.projets.length ? '<a class="btn btn-large" href="#groupes">Notre groupe existe déjà : le choisir</a>' : ''}` };
  }
  if (indexParcours === null) indexParcours = prochaineEtape(p);
  const i = Math.min(Math.max(indexParcours, 0), PARCOURS.length - 1);
  const e = PARCOURS[i], faite = !!e.reussie(p), nb = nbReussies(p);

  const frise = PARCOURS.map((x, n) => {
    const ok = x.reussie(p);
    return `<button class="frise-pt ${ok ? 'ok' : ''} ${n === i ? 'courant' : ''}" data-act="parcours-aller" data-i="${n}" aria-label="Étape ${n + 1}"><span>${ok ? '✓' : x.emoji}</span><small>${n + 1}</small></button>`;
  }).join('');

  let champ = '';
  if (e.champ === 'intention') {
    champ = carte(`<label for="ch-intention"><strong>Notre intention :</strong></label>
      <textarea id="ch-intention" rows="3" data-champ="intention" placeholder="Nous voulons faire ressentir…">${esc(p.intention)}</textarea>
      ${theme(p.themeID) ? `<p class="petit">Rappel, votre thème : ${theme(p.themeID).emoji} ${esc(theme(p.themeID).nom)} — ${esc(theme(p.themeID).description)}</p>` : ''}`);
  } else if (e.champ === 'titreMorceau') {
    champ = carte(`<label for="ch-morceau"><strong>Titre du morceau (facultatif) :</strong></label>
      <input id="ch-morceau" data-champ="titreMorceau" value="${esc(p.titreMorceau)}" placeholder="Titre / artiste">`);
  }

  const coche = p.etapesValidees.includes(e.id);
  return { titre: 'Mon parcours', html: `
    <div class="parcours-haut"><span>Groupe « ${esc(p.nom)} »</span><span>${nb} / ${PARCOURS.length} étapes réussies</span></div>
    <div class="barre vert"><span style="width:${nb / PARCOURS.length * 100}%"></span></div>
    <div class="frise" id="frise">${frise}</div>
    ${carte(`<div class="etape-tete"><span class="gros-emoji">${e.emoji}</span><div><small class="discret">ÉTAPE ${i + 1} SUR ${PARCOURS.length}</small><h2>${esc(e.titre)}</h2>${e.facultative ? etiquette('Facultatif', '#F59E0B') : ''}</div></div>
      <p class="pourquoi">❓ ${esc(e.pourquoi)}</p>`)}
    ${consigne(e.consignes)}
    ${champ}
    <div class="statut ${faite ? 'ok' : 'attente'}"><span>${faite ? '✅' : '⏳'}</span><div><strong>${faite ? 'Bravo, étape réussie !' : 'Pas encore terminé'}</strong>${e.progres ? `<small>${esc(e.progres(p))}</small>` : ''}</div></div>
    ${e.ecran ? `<a class="btn btn-plein btn-large" href="#${e.ecran}">👆 ${esc(e.bouton)}</a>` : ''}
    ${e.manuel ? `<button class="btn btn-large ${coche ? 'vert-contour' : ''}" data-act="parcours-valider" data-arg="${e.id}">${coche ? "✅ C'est fait (toucher pour annuler)" : "☐ C'est fait !"}</button>` : ''}
    <div class="nav-etapes">
      <button class="btn" data-act="parcours-aller" data-i="${i - 1}" ${i === 0 ? 'disabled' : ''}>‹ Précédente</button>
      <button class="btn btn-plein ${faite ? 'vert' : 'gris'}" style="--c:${faite ? 'var(--ok)' : 'var(--doux)'}" data-act="parcours-aller" data-i="${i + 1}" ${i === PARCOURS.length - 1 ? 'disabled' : ''}>${faite || e.facultative ? 'Étape suivante ›' : 'Passer pour l\'instant ›'}</button>
    </div>
    ${i === PARCOURS.length - 1 && faite ? carte('<h2>🎉 Parcours terminé !</h2><p>Bravo ! Vous pouvez continuer à améliorer votre danse et gagner tous les badges.</p>') : ''}`,
    apres: () => { const c = document.querySelector('.frise-pt.courant'); if (c) c.scrollIntoView({ block: 'nearest', inline: 'center' }); } };
}

      <div id="ajout-defi">${defiTire && !enTirage ? boutonAjout(p && p.defis.includes(defiTire.texte), 'Je relève ce défi !', 'Défi relevé', COULEURS.defis, 'basculer-defi', defiTire.texte) : ''}</div>`;

    `<div class="defi-mien"><span>• ${esc(d)}</span><button class="btn-icone" data-act="basculer-defi" data-arg="${esc(d)}" aria-label="Retirer">✕</button></div>`).join('')) : '';

  const lignes = p.blocs.map((b, i) => `
    <div class="bloc">
      <button class="bloc-corps" data-act="editer-bloc" data-arg="${b.id}">
        <span class="bloc-num">${i + 1}</span>
        <span class="ligne-texte"><small>Temps ${i * 8 + 1} à ${i * 8 + 8}</small><strong class="${b.texte ? '' : 'discret'}">${esc(b.texte || 'Phrase à décrire…')}</strong>
        <span class="rangee">${pasDanse(b.pasID) ? etiquette(pasDanse(b.pasID).emoji + ' ' + pasDanse(b.pasID).nom, COULEURS.pas) : ''}${procede(b.procedeID) ? etiquette(procede(b.procedeID).emoji + ' ' + procede(b.procedeID).nom, COULEURS.procedes) : ''}</span></span>

      <div class="bloc-actions">
        <button class="btn-icone" data-act="monter-bloc" data-arg="${b.id}" ${i === 0 ? 'disabled' : ''} aria-label="Monter">▲</button>

      </div>
    </div>`).join('');
  return { titre: 'Ma chorégraphie', html: `

// ---------- Plan de scène ----------
let phraseScene = 0, lectureScene = null;
const COULEURS_PIONS = ['#F08A24', '#8B5CF6', '#14B8A6', '#EC4899', '#3B82F6', '#22C55E', '#EF4444', '#6366F1', '#A16207', '#10B981', '#06B6D4', '#EAB308'];

function vScene() {
  const p = actif();
  if (!p) return { titre: 'Plan de scène', html: ecranVide('Choisis ou crée ton groupe pour faire ton plan de scène.') };
  if (!p.blocs.length) return { titre: 'Plan de scène', html: `<div class="vide"><div class="vide-emoji">🗺️</div><p>Écris d'abord tes phrases de 8 temps dans « Ma chorégraphie », puis reviens ici placer les danseurs.</p><a class="btn btn-plein btn-large" href="#choregraphie">Ouvrir Ma chorégraphie</a></div>` };
  const i = Math.min(phraseScene, p.blocs.length - 1);
  const b = p.blocs[i];
  return { titre: 'Plan de scène', html: `
    ${consigne(['Choisis une phrase juste en dessous (Phrase 1, Phrase 2…).', 'Un rond de couleur = un danseur. Le public est en bas.', 'Fais glisser chaque rond avec ton doigt (ou la souris), ou touche une formation toute prête.', 'Passe à la phrase suivante : les pointillés montrent d\'où vient chaque danseur.', 'Touche « Voir tous les déplacements » pour tout revoir.'])}
    <div class="phrases">${p.blocs.map((_, k) => `<button class="${k === i ? 'actif' : ''}" data-act="phrase-scene" data-i="${k}">Phrase ${k + 1}</button>`).join('')}</div>
    <p><small class="discret">Temps ${i * 8 + 1} à ${i * 8 + 8}</small><br><strong>${esc(b.texte || 'Phrase à décrire dans « Ma chorégraphie »')}</strong></p>
    <div class="plateau"><small>FOND DE SCÈNE</small><svg id="scene-svg" viewBox="0 0 300 200" role="img" aria-label="Plan de scène vu de dessus">${svgScene(p, i)}</svg><small>👀 PUBLIC</small></div>
    <div class="legende-danseurs">${danseurs(p).map((d, k) => `<span><i style="background:${COULEURS_PIONS[k % 12]}"></i>${esc(d)}</span>`).join('')}</div>
    ${carte(titreCarte('Formations toutes prêtes', '🔲') + `<div class="grille-btn">${FORMATIONS.map(f => `<button class="btn" data-act="formation" data-arg="${f.id}">${f.emoji} ${f.nom}</button>`).join('')}</div>
      ${i > 0 ? '<button class="btn" data-act="copier-placement">📋 Même placement que la phrase précédente</button>' : ''}`)}
    <button class="btn btn-plein btn-large" style="--c:${COULEURS.choregraphie}" data-act="lire-scene">${lectureScene ? '⏹ Arrêter' : '▶ Voir tous les déplacements'}</button>
    <p class="petit">💡 Pour changer les prénoms ou le nombre de danseurs, modifie la liste des danseurs dans la fiche projet (séparés par des virgules).</p>` };
}

function svgScene(p, i) {
  const n = danseurs(p).length, noms = danseurs(p);
  const act = positionsBloc(p.blocs[i], n);
  const prec = i > 0 ? positionsBloc(p.blocs[i - 1], n) : null;
  let s = `<rect x="1" y="1" width="298" height="198" rx="10" class="plancher"/>`;
  for (const k of [1, 2]) s += `<line x1="${k * 100}" y1="0" x2="${k * 100}" y2="200" class="quadrillage"/><line x1="0" y1="${k * 200 / 3}" x2="300" y2="${k * 200 / 3}" class="quadrillage"/>`;
  if (prec) prec.forEach((q, k) => {
    const c = COULEURS_PIONS[k % 12];
    s += `<line x1="${q.x * 300}" y1="${q.y * 200}" x2="${act[k].x * 300}" y2="${act[k].y * 200}" stroke="${c}" stroke-width="2" stroke-dasharray="6 4" opacity=".7" data-trait="${k}"/>
          <circle cx="${q.x * 300}" cy="${q.y * 200}" r="10" fill="none" stroke="${c}" stroke-dasharray="3 3" opacity=".6"/>`;
  });
  act.forEach((q, k) => {
    s += `<g class="pion" data-pion="${k}" transform="translate(${q.x * 300} ${q.y * 200})">
      <circle r="13" fill="${COULEURS_PIONS[k % 12]}" stroke="#fff" stroke-width="2"/>
      <text y="4" text-anchor="middle" class="pion-init">${esc(noms[k].slice(0, 2).toUpperCase())}</text>
      <text y="25" text-anchor="middle" class="pion-nom">${esc(noms[k])}</text></g>`;
  });
  return s;
}

// ---------- Auto-évaluation ----------
function vEvaluation() {
  const p = actif();
  if (!p) return { titre: 'Auto-évaluation', html: ecranVide("Choisis ou crée ton groupe pour t'auto-évaluer.") };
  const criteres = D.criteres.map(c => {
    const note = p.notes[c.id] || 0, n = niveau(note);
    return carte(`<h3>${esc(c.nom)}</h3><p class="discret">${esc(c.question)}</p>
      <div class="niveaux">${NIVEAUX.map(x => `<button class="${note === x.v ? 'choisi' : ''}" style="--c:${x.couleur}" data-act="noter" data-arg="${c.id}" data-i="${x.v}"><span>${x.emoji}</span><small>${x.libelle}</small></button>`).join('')}</div>
      ${n ? `<p class="conseil">💡 ${esc(c.conseils[note - 1])}</p>` : ''}`);
  }).join('');
  const restants = D.criteres.filter(c => !(p.notes[c.id] > 0)).length;
  let bilan = `<p class="petit">⏳ Encore ${restants} critère(s) à évaluer pour voir votre bilan.</p>`;
  if (!restants) {
    const m = moyenneEval(p);
    const forts = D.criteres.filter(c => p.notes[c.id] >= 3), faibles = D.criteres.filter(c => p.notes[c.id] <= 2);
    const msg = m < 1.75 ? "On s'accroche ! 💪" : m < 2.5 ? 'Ça progresse 👍' : m < 3.25 ? 'Belle danse ! 👏' : 'Bravo ! 🌟';
    bilan = carte(`${titreCarte('Bilan', '🏁')}<div class="rangee entre"><span class="gros-chiffre">${m.toFixed(1)} <small>/ 4</small></span><strong>${msg}</strong></div>
      ${forts.length ? '<h4>💪 Nos points forts</h4>' + puces(forts.map(c => c.nom), 'var(--ok)') : ''}
      ${faibles.length ? '<h4>🎯 À travailler en priorité</h4>' + faibles.map(c => `<p><strong>${esc(c.nom)}</strong><br><span class="discret">${esc(c.conseils[p.notes[c.id] - 1])}</span></p>`).join('') : ''}`);
  }
  const avis = p.avisSpectateurs.length ? carte(titreCarte('Ce que les spectateurs ont vu', '👀') + `<p>Thème reconnu par ${themeReconnu(p)} groupe(s) sur ${p.avisSpectateurs.length}. Comparez avec votre propre avis !</p>` + p.avisSpectateurs.map(htmlAvis).join('')) : '';
  return { titre: 'Auto-évaluation', html: `
    ${consigne(['Faites-le juste après avoir dansé votre chorégraphie.', 'Pour chaque critère, lisez la question et touchez UN niveau, honnêtement.', 'Lisez le conseil 💡 qui apparaît.', 'Tout en bas : votre bilan avec vos points forts et ce qu\'il faut travailler.'])}
    ${criteres}
    ${carte(`${titreCarte('Commentaire personnel', '💬')}<textarea id="ev-com" rows="3" data-champ="commentaire" placeholder="Ce qui a bien marché ? Ce que vous voulez améliorer ?">${esc(p.commentaire)}</textarea>`)}
    ${avis}${bilan}` };
}

function htmlAvis(a) {
  const th = theme(a.themeDevine);
  const procs = a.procedesVus.map(procede).filter(Boolean);
  const n = v => (niveau(v) || {}).emoji || '–';

    ${procs.length ? `<small class="discret">Procédés vus : ${procs.map(x => x.emoji + ' ' + esc(x.nom)).join(', ')}</small>` : ''}

    ${a.pointFort ? `<p>💪 ${esc(a.pointFort)}</p>` : ''}${a.conseil ? `<p>💡 ${esc(a.conseil)}</p>` : ''}</div>`;

let F = null;

    ${carte(titreCarte('Qui danse ?', '💃') + autres.map(p => choix(p.id, p.nom)).join('') + choix('autre', 'Un groupe sur un autre appareil') +

    ${carte(titreCarte('Quel thème as-tu reconnu ?', '🎭') + `<div class="puces-grille">${D.themes.map(t => puce('sp-theme', t.id, t.emoji + ' ' + t.nom, F.theme === t.id, COULEURS.themes)).join('')}${puce('sp-theme', '?', '🤷 Je ne sais pas', F.jeNeSaisPas, '#888')}</div>`)}
    ${carte(titreCarte('Quels procédés as-tu repérés ?', '🧩') + '<p class="petit">Touche tous ceux que tu as vus.</p>' + `<div class="puces-grille">${D.procedes.map(x => puce('sp-procede', x.id, x.emoji + ' ' + x.nom, F.procedes.includes(x.id), COULEURS.procedes)).join('')}</div>`)}
    ${carte(titreCarte('Ton avis', '⭐') + ligneNiv('lisibilite', "On comprend ce qu'ils veulent montrer") + ligneNiv('originalite', 'Les mouvements sont originaux') + ligneNiv('engagement', 'Les danseurs sont concentrés et engagés'))}
    ${carte(titreCarte("Qu'as-tu ressenti ?", '❤️') + `<div class="ressentis">${RESSENTIS.map(r => `<button class="${F.ressenti === r ? 'choisi' : ''}" data-act="sp-ressenti" data-arg="${r}">${r}</button>`).join('')}</div>`)}
    ${carte(titreCarte('Tes conseils', '💬') + `<label for="sp-fort">Leur point fort</label><input id="sp-fort" data-f="pointFort" value="${esc(F.pointFort)}">
      <label for="sp-conseil">Un conseil pour progresser</label><input id="sp-conseil" data-f="conseil" value="${esc(F.conseil)}">`)}
    <button class="btn btn-plein btn-large vert" style="--c:var(--ok)" data-act="sp-valider" ${complet ? '' : 'disabled'}>✅ Valider mon avis</button>

}

function vueResultatSpectateur(r) {
  let html = carte(`<h2>✅ Merci pour ton avis !</h2>${r.texte ? '' : `<p class="discret">Ton avis a été ajouté à la fiche du groupe « ${esc(r.nom)} ».</p>`}`);
  if (r.themeReel) {
    const ok = r.themeDevine && r.themeDevine.id === r.themeReel.id;
    html += carte(`${titreCarte('Le thème était…', '🎭')}<p class="revelation">${r.themeReel.emoji} ${esc(r.themeReel.nom)}</p>
      ${ok ? '<p class="ok-texte">🎉 Bravo, tu l\'as reconnu ! Le message de leur danse est passé.</p>'
        : r.themeDevine ? `<p>Tu avais pensé à « ${esc(r.themeDevine.nom)} ». Dis-leur ce qui t'a fait penser à ça : ça les aidera à rendre leur thème plus clair.</p>`
        : "<p>Tu n'as pas reconnu le thème : explique au groupe ce qui manquait pour comprendre.</p>"}`);
  }
  if (r.texte) html += carte(`<p>Ce groupe est sur un autre appareil : copie ton avis et envoie-le-lui (ou montre-le-lui).</p><pre class="texte-fiche">${esc(r.texte)}</pre><button class="btn btn-plein" data-act="copier" data-texte="${esc(r.texte)}">📋 Copier mon avis</button>`);
  html += '<button class="btn btn-large" data-act="sp-recommencer">↺ Évaluer un autre groupe</button>';
  return html;
}

let routeActuelle = '';
let telechargements = null; // capacité "downloads" quand la page est hébergée sur claude.ai

function vueCourante() {
  const h = decodeURIComponent(location.hash.slice(1)) || 'accueil';
  const pref = h.slice(0, 2), reste = h.slice(2);
  if (pref === 't-') return vTheme(reste);
  if (pref === 'm-') return vMusique(reste);
  if (pref === 'p-') return vPas(reste);
  if (pref === 'c-') return vProcede(reste);
  if (pref === 'f-') return deverrouille ? vFiche(reste) : vEnseignant();
  const vues = {
    accueil: vAccueil, parcours: vParcours, groupes: vGroupes, themes: vThemes, musiques: vMusiques,
    pas: vPasListe, procedes: vProcedes, defis: vDefis, choregraphie: vChoregraphie, scene: vScene,
    compteur: vCompteur, evaluation: vEvaluation, spectateur: vSpectateur, carnet: vCarnet,
    badges: vBadges, fiche: () => vFiche(null), guide: vGuide, enseignant: vEnseignant
  };
  return (vues[h] || vAccueil)();
}

function afficher(garderScroll = false) {
  const y = window.scrollY;
  arreterLecteurs();
  const v = vueCourante();
  document.getElementById('titre').textContent = v.titre;
  document.getElementById('retour').hidden = !!v.accueil;
  document.title = v.accueil ? 'Danse EPS' : v.titre + ' · Danse EPS';
  document.getElementById('contenu').innerHTML = v.html;
  window.scrollTo(0, garderScroll ? y : 0);
  initialiserLecteurs();
  brancherPage();
  if (v.apres) v.apres();
}

window.addEventListener('hashchange', () => {
  const h = location.hash.slice(1);
  if (routeActuelle === 'compteur' && h !== 'compteur') arreterCompteur();
  if (routeActuelle === 'scene' && lectureScene) { clearInterval(lectureScene); lectureScene = null; }
  if (h !== 'parcours') indexParcours = null;
  routeActuelle = h;
  fermerModale();
  afficher();
});

// ---------- Modale et messages ----------
function ouvrirModale(html) {
  const m = document.getElementById('modale');
  m.querySelector('.modale-boite').innerHTML = html;
  m.hidden = false;
  const champ = m.querySelector('textarea, input, select');
  if (champ) setTimeout(() => champ.focus(), 50);
}
function fermerModale() { document.getElementById('modale').hidden = true; }

function message(texte) {
  const t = document.getElementById('toast');
  t.textContent = texte; t.hidden = false;
  clearTimeout(message.minuteur);
  message.minuteur = setTimeout(() => { t.hidden = true; }, 2600);
}

function annoncerBadge(b) {
  const el = document.getElementById('bandeau-badge');
  el.innerHTML = `<span>${b.emoji}</span><div><small>Nouveau badge !</small><strong>${esc(b.nom)}</strong></div>`;
  el.hidden = false; el.classList.remove('sort'); void el.offsetWidth; el.classList.add('entre');
  clearTimeout(annoncerBadge.m);
  annoncerBadge.m = setTimeout(() => { el.hidden = true; }, 3800);
}

async function copier(texte) {
  try { await navigator.clipboard.writeText(texte); message('📋 Copié ! Tu peux le coller où tu veux.'); }
  catch (e) {
    ouvrirModale(`<h2>Copier le texte</h2><p class="petit">La copie automatique n'est pas autorisée ici : sélectionne le texte ci-dessous et copie-le.</p>
      <textarea rows="10" readonly>${esc(texte)}</textarea><div class="rangee fin"><button class="btn btn-plein" data-act="fermer-modale">Fermer</button></div>`);
    const z = document.querySelector('#modale textarea'); z.focus(); z.select();
  }
}

async function enregistrerFichier(nom, contenu) {
  if (telechargements) {
    try { await telechargements.save({ filename: nom, data: contenu }); message('💾 Fichier enregistré.'); return; }
    catch (e) { /* refusé : on essaie autrement */ }
  }
  try {
    const url = URL.createObjectURL(new Blob([contenu], { type: 'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = nom;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    message('💾 Fichier créé (regarde dans tes téléchargements).');
  } catch (e) { copier(contenu); }
}

const nomFichier = n => 'DanseEPS - ' + n.replace(/[\/\\:?*"<>|]/g, '-') + '.json';

function importerTexte(texte) {
  const zone = document.getElementById('message-import');
  try {
    let liste = JSON.parse(texte);
    if (!Array.isArray(liste)) liste = [liste];
    liste = liste.filter(p => p && p.id && p.nom).map(normaliser);
    if (!liste.length) throw new Error();
    for (const p of liste) {
      const i = S.projets.findIndex(q => q.id === p.id);
      if (i >= 0) S.projets[i] = p; else S.projets.push(p);
    }
    if (liste.length === 1 && routeActuelle !== 'enseignant') S.actifId = liste[0].id;
    sauver();
    message(`✅ ${liste.length} groupe(s) importé(s).`);
    afficher(true);
  } catch (e) {
    if (zone) zone.textContent = "❌ Ce fichier n'est pas un groupe Danse EPS.";
  }
}

// ---------- Compteur ----------
function bip(fort) {
  try {
    if (!C.audio) C.audio = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = C.audio, o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = fort ? 1320 : 880; o.type = 'square';
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(fort ? 0.35 : 0.18, ctx.currentTime + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.08);
    o.connect(g).connect(ctx.destination); o.start(); o.stop(ctx.currentTime + 0.09);
  } catch (e) {}
}

function tickCompteur() {
  if (!C.en) return;
  if (C.temps === 0 || C.temps === 8) { C.temps = 1; C.phrase++; } else C.temps++;
  if (C.son) bip(C.temps === 1);
  if (navigator.vibrate) { try { navigator.vibrate(C.temps === 1 ? 40 : 10); } catch (e) {} }
  majCompteur();
  C.minuteur = setTimeout(tickCompteur, 60000 / C.bpm);
}

function majCompteur() {
  const ch = document.getElementById('chiffre'); if (!ch) return;
  ch.textContent = C.temps || '–';
  ch.classList.toggle('un', C.temps === 1);
  document.getElementById('phrase-compteur').textContent = C.en ? 'phrase ' + C.phrase : 'prêts ?';
  document.getElementById('anneau').style.setProperty('--p', C.temps / 8);
  document.querySelectorAll('#points i').forEach((el, k) => el.classList.toggle('on', k < C.temps));
  const b = document.getElementById('btn-compteur');
  b.textContent = C.en ? '⏹ Arrêter' : '▶ Démarrer';
  b.style.setProperty('--c', C.en ? 'var(--danger)' : COULEURS.compteur);
}

function arreterCompteur() { C.en = false; clearTimeout(C.minuteur); C.temps = 0; C.phrase = 0; majCompteur(); }

// ---------- Plan de scène : glisser les danseurs ----------
function brancherScene() {
  const svg = document.getElementById('scene-svg'); if (!svg) return;
  const p = actif(); const i = Math.min(phraseScene, p.blocs.length - 1);
  const n = danseurs(p).length;
  let glisse = null, pos = positionsBloc(p.blocs[i], n);
  const versScene = ev => {
    const r = svg.getBoundingClientRect();
    return { x: Math.min(Math.max((ev.clientX - r.left) / r.width, .04), .96), y: Math.min(Math.max((ev.clientY - r.top) / r.height, .05), .95) };
  };
  svg.addEventListener('pointerdown', ev => {
    const g = ev.target.closest('.pion'); if (!g) return;
    glisse = Number(g.dataset.pion); g.classList.add('glisse');
    svg.setPointerCapture(ev.pointerId); ev.preventDefault();
  });
  svg.addEventListener('pointermove', ev => {
    if (glisse === null) return;
    const q = versScene(ev); pos[glisse] = q;
    svg.querySelector(`[data-pion="${glisse}"]`).setAttribute('transform', `translate(${q.x * 300} ${q.y * 200})`);
    const t = svg.querySelector(`[data-trait="${glisse}"]`);
    if (t) { t.setAttribute('x2', q.x * 300); t.setAttribute('y2', q.y * 200); }
  });
  const fin = () => {
    if (glisse === null) return;
    glisse = null;
    modifier(pr => { pr.blocs[i].positions = pos.map((q, k) => ({ danseur: k, x: q.x, y: q.y })); });
    afficher(true);
  };
  svg.addEventListener('pointerup', fin);
  svg.addEventListener('pointercancel', fin);
}

function placer(points) {
  const p = actif(); const i = Math.min(phraseScene, p.blocs.length - 1);
  modifier(pr => { pr.blocs[i].positions = points.map((q, k) => ({ danseur: k, x: q.x, y: q.y })); });
  afficher(true);
}

// ---------- Champs de saisie ----------
function brancherPage() {
  brancherScene();
  const bpm = document.getElementById('bpm');
  if (bpm) bpm.addEventListener('input', () => { C.bpm = Number(bpm.value); document.getElementById('bpm-texte').textContent = C.bpm + ' temps / minute'; });
  const son = document.getElementById('son');
  if (son) son.addEventListener('change', () => { C.son = son.checked; });
  const fi = document.getElementById('fichier-import');
  if (fi) fi.addEventListener('change', () => {
    const f = fi.files[0]; if (!f) return;
    const r = new FileReader(); r.onload = () => importerTexte(String(r.result)); r.readAsText(f);
  });
  const filtre = document.getElementById('filtre-defi');
  if (filtre) filtre.addEventListener('change', () => { filtreDefi = filtre.value; });
}

  'monter-bloc': el => { modifier(p => { const i = p.blocs.findIndex(b => b.id === el.dataset.arg); if (i > 0) [p.blocs[i - 1], p.blocs[i]] = [p.blocs[i], p.blocs[i - 1]]; }); afficher(true); },
  'descendre-bloc': el => { modifier(p => { const i = p.blocs.findIndex(b => b.id === el.dataset.arg); if (i < p.blocs.length - 1) [p.blocs[i + 1], p.blocs[i]] = [p.blocs[i], p.blocs[i + 1]]; }); afficher(true); },

  'lire-scene': () => {
    if (lectureScene) { clearInterval(lectureScene); lectureScene = null; afficher(true); return; }

    lectureScene = setInterval(() => {
      const p = actif();
      if (!p || phraseScene >= p.blocs.length - 1) { clearInterval(lectureScene); lectureScene = null; afficher(true); return; }

  },

  'sp-procede': el => { basculer(F.procedes, el.dataset.arg); afficher(true); },

  'sp-ressenti': el => { F.ressenti = el.dataset.arg; afficher(true); },

  'sp-valider': () => {
    const avis = { id: uid(), date: maintenant(), observateurs: F.observateurs.trim() || 'Spectateurs', themeDevine: F.theme, procedesVus: F.procedes.slice(),

  ['✅', '3. Le bouton devient vert', "Quand tu choisis un thème, un pas ou un procédé, appuie sur le gros bouton coloré en haut de la fiche.\nS'il devient VERT, c'est ajouté à ton projet !"],
  ['🎬', '4. Regarde les bonshommes', 'Chaque pas est montré par un bonhomme animé.\nLe cercle jaune montre la partie du corps à regarder. Touche une image de la bande pour voir une étape précise.'],
  ['⬅️', '5. Pour revenir en arrière', 'Touche « ← Retour » en haut à gauche.\nTu peux revoir cette présentation à tout moment avec le bouton « ? » en haut à droite.']
];

function pageBienvenue(i) {
  pageB = Math.max(0, Math.min(i, PAGES_BIENVENUE.length - 1));
  const [e, t, x] = PAGES_BIENVENUE[pageB], der = pageB === PAGES_BIENVENUE.length - 1;

    <div class="rangee entre">${der ? '<span></span><button class="btn btn-plein btn-large vert" style="--c:var(--ok)" data-act="bienvenue-fin">C\'est parti ! 🚀</button>'
      : '<button class="btn" data-act="bienvenue-fin">Passer</button><button class="btn btn-plein" data-act="bienvenue-suivant">Suivant ›</button>'}</div>`;
}

}
